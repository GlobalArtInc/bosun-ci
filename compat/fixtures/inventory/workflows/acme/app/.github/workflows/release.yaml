name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release
        required: true
        type: string
  schedule:
    - cron: '0 3 * * 1'

jobs:
  build:
    uses: acme/shared/.github/workflows/build.yml@main
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  publish:
    needs: build
    runs-on: [self-hosted, linux]
    environment: production
    timeout-minutes: 30
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./publish.sh
        timeout-minutes: 10
        continue-on-error: true
