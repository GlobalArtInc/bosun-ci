[workspace]
resolver = "3"
members = ["bin/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://github.com/GlobalArtInc/bosun"

[workspace.dependencies]
bosun-blob = { path = "crates/blob" }
bosun-db = { path = "crates/db" }
bosun-server = { path = "crates/server" }
bosun-testkit = { path = "crates/testkit" }
bosun-types = { path = "crates/types" }
bosun-workflow = { path = "crates/workflow" }

axum = { version = "0.8", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
clap = { version = "4", features = ["derive"] }
crc = "3"
getrandom = "0.4"
http-body = "1"
reqwest = { version = "0.12", default-features = false }
saphyr-parser = "0.2"
sea-orm = { version = "1.1", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-chrono",
    "with-json",
    "with-uuid",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlmig = "0.2"
tempfile = "3"
thiserror = "2"
tokio = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tonic = { version = "0.14", default-features = false }
tower = { version = "0.5", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
url = "2"
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
