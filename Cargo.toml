[workspace]
resolver = "3"
members = ["bin/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://github.com/GlobalArtInc/bosun-ci"

[profile.release]
strip = true

[workspace.dependencies]
bosun-blob = { path = "crates/blob" }
bosun-db = { path = "crates/db" }
bosun-expr = { path = "crates/expr" }
bosun-forge = { path = "crates/forge" }
bosun-proto = { path = "crates/proto" }
bosun-runner = { path = "crates/runner" }
bosun-server = { path = "crates/server" }
bosun-testkit = { path = "crates/testkit" }
bosun-types = { path = "crates/types" }
bosun-workflow = { path = "crates/workflow" }

aho-corasick = "1"
argon2 = "0.6"
axum = { version = "0.8", default-features = false }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
chrono-tz = { version = "0.10", default-features = false }
clap = { version = "4", features = ["derive"] }
crc = "3"
fancy-regex = "0.19"
flate2 = "1"
getrandom = "0.4"
hmac = "0.12"
http-body = "1"
ipnet = "2"
jsonschema = { version = "0.56", default-features = false }
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz"] }
prost = "0.14"
prost-types = "0.14"
proptest = { version = "1", default-features = false, features = ["std"] }
protox = "0.9"
quick-xml = "0.42"
reqwest = { version = "0.12", default-features = false }
ring = "0.17"
rustix = "1.1"
rustls-pki-types = "1"
ruzstd = "0.9"
saphyr-parser = "0.2"
schemars = { version = "1.2", default-features = false, features = ["chrono04", "derive", "std"] }
sea-orm = { version = "1.1", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-chrono",
    "with-json",
    "with-uuid",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlmig = "0.2"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-stream = { version = "0.1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
url = "2"
uuid = { version = "1", default-features = false, features = ["std", "serde"] }

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.lzma-rust2]
opt-level = 3
