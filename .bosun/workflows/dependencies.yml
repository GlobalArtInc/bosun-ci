name: Dependency rules

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependencies:
    name: dependency rules
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Put cargo on the path
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install the Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustc --version
          cargo --version

      - name: Dependency rules
        run: hack/check-deps.sh

      - name: Dependency rules refuse forbidden edges
        run: hack/test-check-deps.sh
