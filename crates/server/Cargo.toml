[package]
name = "bosun-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
argon2.workspace = true
axum = { workspace = true, features = ["http1", "http2", "json", "query", "tokio"] }
base64.workspace = true
bosun-blob.workspace = true
bosun-db.workspace = true
bosun-expr.workspace = true
bosun-forge.workspace = true
bosun-proto.workspace = true
bosun-types.workspace = true
bosun-workflow.workspace = true
chrono = { workspace = true, features = ["now"] }
chrono-tz.workspace = true
crc.workspace = true
flate2.workspace = true
getrandom.workspace = true
hmac.workspace = true
http-body.workspace = true
ipnet.workspace = true
prost-types.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots", "stream"] }
ring.workspace = true
ruzstd.workspace = true
schemars.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["io", "io-util"] }
toml.workspace = true
tonic = { workspace = true, features = ["router"] }
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
bosun-testkit.workspace = true
jsonschema.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tracing-subscriber = { workspace = true, features = ["fmt", "json", "std"] }
