[package]
name = "bosun-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
base64.workspace = true
bosun-blob.workspace = true
bosun-db.workspace = true
bosun-proto.workspace = true
bosun-types.workspace = true
chrono = { workspace = true, features = ["now"] }
flate2.workspace = true
reqwest = { workspace = true, features = ["json"] }
ring.workspace = true
rustls-pki-types.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "time"] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["channel"] }
url.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
hmac.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
