on: push

env:
  REGISTRY_USER: ${{ secrets.REGISTRY_USER }}

jobs:
  publish:
    runs-on: shell
    env:
      TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - run: echo "${{ secrets['REGISTRY_PASSWORD'] }}" | docker login -u "$REGISTRY_USER" --password-stdin

  test:
    runs-on: shell
    steps:
      - run: make test
      - run: echo "${{ secrets[true] }}" "${{ secrets[null] }}"
