on: push

jobs:
  test:
    runs-on: shell
    services:
      postgres:
        image: postgres:16
        credentials:
          username: ci
          password: ${{ secrets.REGISTRY_PASSWORD }}
        env:
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
          POSTGRES_USER: ${{ job.status }}
        ports:
          - 5432
        volumes:
          - pgdata:/var/lib/postgresql/data
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
      cache:
        image: redis
    steps:
      - run: docker port "${{ job.services.postgres.id }}" 5432/tcp
      - run: psql -p ${{ job.services.postgres.ports['5432'] }} -h ${{ job.container.network }}
