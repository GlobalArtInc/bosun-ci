conclusion = "success"

[secrets]
TOKEN = "s3cr3t-t0ken"

[outputs]
token = "${{ steps.write.outputs.token }}"
prefixed = "token ${{ secrets.TOKEN }}"
kept = "${{ steps.write.outputs.kept }}"

[reported]
kept = "visible"

[[steps]]
id = "write"
env = { TOKEN = "${{ secrets.TOKEN }}" }
run = '''
echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
echo "kept=visible" >> "$GITHUB_OUTPUT"
'''
outcome = "success"
outputs = { token = "***", kept = "visible" }

[[steps]]
run = '''
test '${{ steps.write.outputs.token }}' = "s3cr3t-t0ken"
echo "the next step reads ${{ steps.write.outputs.token }}"
'''
outcome = "success"
output = [
  "the next step reads ***",
  "the output `prefixed` of the job is not reported, since it contains a masked value",
  "the output `token` of the job is not reported, since it contains a masked value",
]
