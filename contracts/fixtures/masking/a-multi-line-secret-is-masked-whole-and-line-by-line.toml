conclusion = "failure"

[secrets]
KEY = "-----BEGIN KEY-----\nMIIBOgIBAAJBAKj34GkxFhD90vcNLYLInFEX6Ppy1tPf9Cnzj4p4WGeK\n-----END KEY-----"

[[steps]]
env = { KEY = "${{ secrets.KEY }}", JSON = "${{ toJSON(secrets.KEY) }}" }
run = '''
echo "$KEY"
echo "the second line is $(echo "$KEY" | sed -n 2p), and that is all"
echo "$KEY" | while read -r line; do echo "[$line]"; done
echo "$JSON"
'''
outcome = "success"
output = [
  "***",
  "***",
  "***",
  "the second line is ***, and that is all",
  "[***]",
  "[***]",
  "[***]",
  '"***"',
]

[[steps]]
run = '''echo "${{ format(format('{0}{{', secrets.KEY)) }}"'''
outcome = "failure"
output = [
  "`run` of the step could not be evaluated at line 1, column 11: the template of `format` is not valid: `***{`; a brace that is not doubled encloses the number of an argument",
]
