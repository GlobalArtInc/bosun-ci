conclusion = "success"

[github]
repository = "GlobalArtInc/keel"
server_url = "https://github.com"

[[steps]]
run = '''
mkdir -p .git src
printf '[remote "origin"]\n\turl = https://github.com/GlobalArtInc/keel\n' > .git/config
touch src/app.js src/util.js
echo "::add-matcher::$FIXTURES/eslint-stylish.json"
'''
outcome = "success"
output = ["added the problem matchers `eslint-stylish`"]

[[steps]]
run = '''
echo "src/app.js"
echo "  1:10  error  'x' is assigned a value but never used  no-unused-vars"
echo "  2:1  warning  Unexpected console statement  no-console"
echo "  3:1  info  Not an annotation  some-rule"
echo ""
echo "src/util.js"
printf '  4:2  \033[31merror\033[39m  Missing semicolon  semi\n'
echo ""
echo "✖ 3 problems (2 errors, 1 warning)"
'''
outcome = "success"
output = [
  "src/app.js",
  "##[error]  1:10  error  'x' is assigned a value but never used  no-unused-vars",
  "##[warning]  2:1  warning  Unexpected console statement  no-console",
  "  3:1  info  Not an annotation  some-rule",
  "",
  "src/util.js",
  "##[error]  4:2  error  Missing semicolon  semi",
  "",
  "✖ 3 problems (2 errors, 1 warning)",
]
annotations = [
  { kind = "error", message = "'x' is assigned a value but never used", file = "src/app.js", line = 1, column = 10 },
  { kind = "warning", message = "Unexpected console statement", file = "src/app.js", line = 2, column = 1 },
  { kind = "error", message = "Missing semicolon", file = "src/util.js", line = 4, column = 2 },
]

[[steps]]
run = '''
echo "::remove-matcher owner=ESLint-Stylish::"
echo "src/app.js"
echo "  1:10  error  'x' is assigned a value but never used  no-unused-vars"
'''
outcome = "success"
output = [
  "removed the problem matchers `eslint-stylish`",
  "src/app.js",
  "  1:10  error  'x' is assigned a value but never used  no-unused-vars",
]
