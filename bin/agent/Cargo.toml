[package]
name = "bosun-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
bosun-proto.workspace = true
bosun-runner.workspace = true
bosun-types.workspace = true
chrono = { workspace = true, features = ["std"] }
clap.workspace = true
getrandom.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots"] }
rustix = { workspace = true, features = ["fs", "system"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream.workspace = true
toml = { workspace = true, features = ["display"] }
tonic = { workspace = true, features = ["channel", "tls-ring", "tls-webpki-roots"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "json", "std"] }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "http2", "json", "tokio"] }
bosun-expr.workspace = true
prost.workspace = true
prost-types.workspace = true
rustix = { workspace = true, features = ["process"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process"] }
tonic = { workspace = true, features = ["router"] }
uuid = { workspace = true, features = ["v7"] }
