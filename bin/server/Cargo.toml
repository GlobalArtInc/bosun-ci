[package]
name = "bosun-server-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "bosun-server"
path = "src/main.rs"

[dependencies]
bosun-server.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "json", "std"] }

[dev-dependencies]
bosun-blob.workspace = true
bosun-db.workspace = true
bosun-proto.workspace = true
bosun-testkit.workspace = true
bosun-types.workspace = true
prometheus-parse.workspace = true
reqwest = { workspace = true, features = ["http2", "json"] }
sea-orm.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tonic.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v7"] }
